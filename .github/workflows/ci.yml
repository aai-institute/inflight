name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check + Coverage (Linux)
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: ci
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: pixi run -e ci cargo fmt --all -- --check
      - name: cargo clippy
        run: pixi run -e ci cargo clippy --all-targets --all-features -- -D warnings
      # All-features is clippied above; pyo3 implies memory, so subsets with both are left out.
      - name: cargo clippy (feature subsets)
        run: |
          for features in "" memory tracing testing pyo3 memory,tracing memory,testing memory,tracing,testing pyo3,tracing pyo3,testing tracing,testing; do
            echo "::group::features=[$features]"
            pixi run -e ci cargo clippy --all-targets --no-default-features --features "$features" -- -D warnings
            echo "::endgroup::"
          done
      # Coverage tests only --all-features, which hides breakage with features off.
      - name: cargo test (default features)
        run: pixi run -e ci cargo test --no-fail-fast
      - name: coverage (cargo test, instrumented)
        run: pixi run -e ci coverage

  msrv:
    name: MSRV (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (all features, at the declared MSRV)
        run: cargo check --all-features

  deny:
    name: Dependency policy (licenses, duplicates, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: gates
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo deny
        run: pixi run -e gates deny

  platform:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      RUSTFLAGS: "-C debuginfo=0"
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: platform
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: pixi run -e platform test
