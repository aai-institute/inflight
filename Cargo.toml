[package]
name = "inflight"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Kristof Schröder <k.schroeder@appliedai-institute.de>"]
license = "MIT"
readme = "README.md"
description = "Stop a running computation at the safe points it chooses, and learn why it stopped"
repository = "https://github.com/aai-institute/inflight"
categories = ["concurrency"]

[dependencies]
memory-stats = { version = "1.2", features = ["always_use_statm"], optional = true }
pyo3 = { version = "0.29", optional = true }
tracing = { version = "0.1", optional = true, default-features = false }

[features]
memory = ["dep:memory-stats"]
pyo3 = ["dep:pyo3", "memory"]
tracing = ["dep:tracing"]
testing = []

[lints.rust]
unsafe_code = "forbid"

[[test]]
name = "memory"
required-features = ["memory"]

[[test]]
name = "countdown"
required-features = ["testing"]

[[test]]
name = "traced"
required-features = ["tracing"]

[[test]]
name = "python"
required-features = ["pyo3"]

[[test]]
name = "signal"
harness = false
required-features = ["pyo3"]

[dev-dependencies]
tracing = { version = "0.1", features = ["std"] }
