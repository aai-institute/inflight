[package]
name = "inflight"
version = "0.3.1"
edition = "2021"
rust-version = "1.85"
authors = ["Kristof Schröder <k.schroeder@appliedai-institute.de>"]
license = "MIT"
readme = "README.md"
description = "Primitives for numerical libraries: stop a running computation at the safe points it chooses, and run parallel work whose results do not depend on the thread count"
repository = "https://github.com/aai-institute/inflight"
categories = ["concurrency", "science"]
keywords = ["cancellation", "progress", "parallel", "deterministic", "pyo3"]
include = ["/src/**/*.rs", "/guides/*.md", "/README.md", "/CHANGELOG.md", "/LICENSE"]

# docs.rs builds default features alone otherwise, which leaves out `parallel` and the Python bridge.
[package.metadata.docs.rs]
all-features = true

[dependencies]
dyn-stack = { version = "0.13.2", default-features = false, features = ["alloc"], optional = true }
pyo3 = { version = "0.29", optional = true }
rayon = { version = "1.10", optional = true }

[dev-dependencies]
rstest = { version = "0.26.1", default-features = false }

[features]
pyo3 = ["dep:pyo3"]
rayon = ["dep:rayon", "dep:dyn-stack"]
testing = ["rayon"]

# Denied, not forbidden: `parallel::disjoint` and `parallel::places` alone allow it, for tasks writing
# one shared slice.
[lints.rust]
unsafe_code = "deny"

[[test]]
name = "python"
required-features = ["pyo3"]

[[test]]
name = "signal"
harness = false
required-features = ["pyo3"]
